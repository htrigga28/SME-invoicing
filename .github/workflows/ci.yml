name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Coverage (API, LCOV for SonarCloud)
        run: pnpm --filter @sme-invoicing/api test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-lcov
          path: apps/api/coverage/lcov.info
          if-no-files-found: error

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://lumina.example.test
          NEXT_PUBLIC_APP_URL: https://app.lumina.example.test
          NEXT_PUBLIC_MARKETING_URL: https://lumina.example.test
          NEXT_PUBLIC_API_URL: https://api.lumina.example.test
