# SonarCloud CI-based analysis configuration.
# Automatic analysis cannot ingest coverage; when CI-based analysis is enabled
# (SONAR_TOKEN set, automatic analysis disabled in SonarCloud), the `coverage`
# job below produces this LCOV file and the scanner uploads it so the quality
# gate measures new-code coverage instead of reporting 0%.
sonar.projectKey=htrigga28_SME-invoicing
sonar.organization=htrigga28
sonar.sources=apps/api/src,apps/web/src
sonar.tests=apps/api/src,apps/web/src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/drizzle/**,**/node_modules/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
sonar.sourceEncoding=UTF-8
